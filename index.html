/* ---------------- ROUND SETUP (host-only shuffling) ---------------- */
function hostStartRound(){
  if(!IS_HOST) return;
  if(G.matchOver) return;
  const deck = shuffle(freshDeck());
  const hands = {0:[],1:[],2:[],3:[]};
  const first = nextSeat(G.dealer);
  let order4 = [];
  for(let k=0;k<4;k++) order4.push(ORDER[(ORDER.indexOf(first)+k)%4]);
  for(const seat of order4) hands[seat] = deck.splice(0,4);

  G.round = {
    deck, hands, order4, first,
    bidHistory: [], highBid: 0, highBidder: null, passed: [],
    trump: null, trumpRevealed:false, secondOptionSeat:null,
    tricks: [], trickNo:0, leader:first,
    current: {}, leadSuit:null, playOrder:[],
    pointsA:0, pointsB:0,
    pairDeclared:{A:false,B:false},
    singles:null, doubled:false, bidMultiplier:1, partnerRevealShown:false, originalTrump:null,
    bidDoubleBy:null, redoubleBy:null, pairDeclaredBy:null, forcedTrumpFor:null,
    phase:'bidding',
    awaiting:{type:'bid', seat:first},
    log:[]
  };
  const firstHandPts = hands[first].reduce((sum,c)=>sum+RANK_POINTS[c.r],0);
  if(firstHandPts===0){
    logMsg(`${pname(first)} (first to bid) was dealt four cards worth 0 points — round cancelled.`);
    G.round.awaiting = {type:'redealAck', reason:'firstBidderNoPoints', seat:first};
    pushState();
    showRedealOverlay();
    return;
  }
  logMsg(`— New round — dealer: ${pname(G.dealer)}, first to bid: ${pname(first)}`);
  startBidding();
}

function handStrength(hand){
  const bySuit = {};
  for(const s of SUITS) bySuit[s] = [];
  for(const c of hand) bySuit[c.s].push(c.r);
  let best = {suit:null, score:-1};
  for(const s of SUITS){
    const cards = bySuit[s];
    let score = cards.length * 2;
    for(const r of cards) score += RANK_POINTS[r]*1.4 + (r==='9'?1:0);
    if(score>best.score) best = {suit:s, score};
  }
  return best;
}

function logMsg(msg){
  G.round.log = G.round.log || [];
  G.round.log.unshift(msg);
  if(G.round.log.length>60) G.round.log.length=60;
}

/* ---------------- DISPATCH / RESUME ---------------- */
function resumeFlow(){
  if(!G || !G.round) return;
  const rd = G.round;
  if(G.matchOver) return;
  const aw = rd.awaiting;
  if(!aw) return;
  switch(aw.type){
    case 'bid': bidTurn(aw.seat); break;
    case 'trump': doTrumpStep(aw.seat); break;
    case 'trumpSecondPick': doSecondOptionStep(aw.seat); break;
    case 'bidDoubleOffer': doBidDoubleOfferStep(); break;
    case 'redoubleOffer': doRedoubleOfferStep(); break;
    case 'singlesOffer': doSinglesOfferStep(); break;
    case 'double': doDoubleStep(aw.seat); break;
    case 'play': playTurn(aw.seat); break;
    case 'redealAck': showRedealOverlay(); break;
    case 'roundEndAck': showRoundEndOverlay(); break;
    case 'matchEndAck': showMatchEndOverlay(); break;
  }
}

/* ---------------- AI FUNCTIONS (used for computers and auto-play) ---------------- */
function aiBid(seat){
  const rd = G.round;
  const hand = rd.hands[seat];
  const {score} = handStrength(hand);
  const isDealer = (seat===G.dealer);
  const mustBid = isDealer && rd.highBid===0;
  const minBid = rd.highBid===0 ? 16 : rd.highBid+1;
  const comfortCap = Math.min(28, Math.round(16+score/3));
  let action;
  if(mustBid){ action = {bid: Math.max(16, Math.min(28, Math.max(minBid,comfortCap)))}; }
  else if(minBid>28){ action = {pass:true}; }
  else if(minBid<=comfortCap){ action = {bid: minBid}; }
  else { action = {pass:true}; }
  if(action.pass){ rd.passed.push(seat); logMsg(`${pname(seat)} passes.`); resolveDuelStep(seat, true); }
  else { rd.highBid=action.bid; rd.highBidder=seat; logMsg(`${pname(seat)} bids ${action.bid}${mustBid?' (forced, nobody had bid yet)':''}.`); resolveDuelStep(seat, false); }
}

function aiTrump(seat){
  const {suit} = handStrength(G.round.hands[seat]);
  setTrump(suit);
}

function aiBidDouble(opp){
  // returns true if opponent decides to double
  return Math.random()<0.25;
}
function aiRedouble(sideSeat){
  // returns true if side seat decides to redouble
  return Math.random()<0.2;
}
function aiSingles(seat){
  const {score} = handStrength(G.round.hands[seat]);
  return score>16 && Math.random()<0.3;
}

function aiPlay(seat, legal){
  const rd = G.round;
  let choice;
  let skipTrumpCheck = false;
  if(rd.leadSuit && legalIsDiscardOnly(seat)){
    const trumpsInHand = legal.filter(c=>c.s===rd.trump);
    if(seat===rd.highBidder && trumpsInHand.length>0 && !rd.trumpRevealed){
      // the bidder knows their own secret trump suit and can deliberately play it
      choice = trumpsInHand[0];
    } else if(rd.trumpRevealed && trumpsInHand.length>0 && Math.random()<0.6){
      // trump is already known to everyone — anyone can now deliberately trump in
      choice = trumpsInHand[0];
    } else if(!rd.trumpRevealed && Math.random()<0.5){
      // decides not to attempt trump this time — a safe discard regardless of suit
      choice = legal.slice().sort((a,b)=>rankIdx(a.r)-rankIdx(b.r))[0];
      skipTrumpCheck = true;
    } else if(!rd.trumpRevealed && G.trumpMode==='show'){
      // Show Trump: attempting trump reveals it FIRST, then they choose informed
      rd.trumpRevealed = true;
      logMsg(`${pname(seat)} chose to Trump — trump revealed: ${SUIT_SYM[rd.trump]} ${SUIT_NAME[rd.trump]}.`);
      announce(`Trump revealed: ${SUIT_SYM[rd.trump]} ${SUIT_NAME[rd.trump]}`);
      choice = trumpsInHand.length>0 ? trumpsInHand[0] : legal.slice().sort((a,b)=>rankIdx(a.r)-rankIdx(b.r))[0];
    } else {
      // Hidden Trump: attempts trump by choosing a card, not knowing whether it matches
      choice = legal.slice().sort((a,b)=>rankIdx(a.r)-rankIdx(b.r))[0];
    }
  } else {
    choice = legal.slice().sort((a,b)=>rankIdx(a.r)-rankIdx(b.r))[0];
  }
  playCard(seat, choice, {skipTrumpCheck});
}

/* ---------------- BIDDING ---------------- */
function startBidding(){
  const rd = G.round;
  rd.duelSeats = [rd.order4[0], rd.order4[1]];
  rd.pendingQueue = [rd.order4[2], rd.order4[3]];
  rd.awaiting = {type:'bid', seat: rd.order4[0]};
  pushState();
  bidTurn(rd.order4[0]);
}
function bidTurn(seat){
  const rd = G.round;
  rd.awaiting = {type:'bid', seat};
  if(shouldHostAuto(seat)){
    setTimeout(()=>{
      if(!G || !G.round || G.round.awaiting.type!=='bid' || G.round.awaiting.seat!==seat) return;
      aiBid(seat);
    }, 550);
    return;
  }
  if(!authorizedFor(seat)){
    clearDecisionUI();
    setPanelMsg(`Waiting for ${seatLabel(seat)} to bid...`);
    return;
  }
  if(seat===MY_SEAT){ presentHumanBid(); return; }
  setTimeout(()=>{
    if(!G || !G.round || G.round.awaiting.type!=='bid' || G.round.awaiting.seat!==seat) return;
    aiBid(seat); // for computer or any host-controlled seat (shouldHostAuto already handled above)
  }, 550);
}
function resolveDuelStep(actingSeat, didPass){
  const rd = G.round;
  const other = rd.duelSeats.find(s=>s!==actingSeat);
  if(!didPass){
    rd.awaiting = {type:'bid', seat: other};
    bidTurn(other);
    return;
  }
  const otherPassed = rd.passed.includes(other);
  if(otherPassed){
    if(rd.pendingQueue.length>=2){
      const nextA = rd.pendingQueue.shift();
      const nextB = rd.pendingQueue.shift();
      rd.duelSeats = [nextA, nextB];
      rd.awaiting = {type:'bid', seat: nextA};
      bidTurn(nextA);
    } else if(rd.pendingQueue.length===1){
      const last = rd.pendingQueue.shift();
      rd.duelSeats = [last, last];
      rd.awaiting = {type:'bid', seat: last};
      bidTurn(last);
    } else {
      finishBidding();
    }
    return;
  }
  if(rd.pendingQueue.length===0){
    finishBidding();
    return;
  }
  const challenger = rd.pendingQueue.shift();
  rd.duelSeats = [other, challenger];
  rd.awaiting = {type:'bid', seat: challenger};
  bidTurn(challenger);
}
function biddingStatusText(){
  const rd = G.round;
  return [0,1,2,3].map(seat=>{
    const name = seat===MY_SEAT ? 'You' : seatLabel(seat);
    const dealerTag = seat===G.dealer ? ' (dealer)' : '';
    if(rd.passed.includes(seat)) return `${name}${dealerTag}: Passed`;
    if(rd.highBidder===seat) return `${name}${dealerTag}: Bid ${rd.highBid} ★`;
    if((rd.duelSeats||[]).includes(seat)) return `${name}${dealerTag}: Deciding...`;
    return `${name}${dealerTag}: Waiting to enter`;
  }).join('\n');
}
function presentHumanBid(){
  const rd = G.round;
  const isDealer = (MY_SEAT===G.dealer);
  const mustBid = isDealer && rd.highBid===0;
  const minBid = rd.highBid===0 ? 16 : rd.highBid+1;
  setPanelMsg(mustBid ? 'Everyone passed — as dealer you must bid.' : 'Your turn to bid.');
  setPanelBtns([]);
  const btns = [];
  for(let v=minBid; v<=28; v++){
    btns.push({label:`Bid ${v}`, cls: v===minBid?'primary':'', fn:()=>{
      hideOverlay();
      rd.highBid = v; rd.highBidder = MY_SEAT;
      logMsg(`You bid ${v}${mustBid?' (forced, nobody had bid yet)':''}.`);
      resolveDuelStep(MY_SEAT, false);
      pushState();
    }});
  }
  if(!mustBid){
    btns.push({label:'Pass', cls:'ghost', fn:()=>{
      hideOverlay();
      rd.passed.push(MY_SEAT);
      logMsg('You pass.');
      resolveDuelStep(MY_SEAT, true);
      pushState();
    }});
  }
  const explain = (mustBid
    ? 'Everyone else passed — as dealer, you must choose a bid between 16 and 28. You cannot pass.'
    : `Current high bid: ${rd.highBid||'none'}. You must bid higher, or pass.`)
    + '\n\n' + biddingStatusText();
  showOverlay(mustBid ? 'Everyone Passed' : 'Your Bid', explain, btns);
}
function finishBidding(){
  const rd = G.round;
  logMsg(`${pname(rd.highBidder)} won the bid at ${rd.highBid}.`);
  rd.awaiting = {type:'trump', seat: rd.highBidder};
  doTrumpStep(rd.highBidder);
  pushState();
}

/* ---------------- TRUMP ---------------- */
function doTrumpStep(seat){
  if(shouldHostAuto(seat)){
    setTimeout(()=>{
      if(!G || !G.round || G.round.awaiting.type!=='trump' || G.round.awaiting.seat!==seat) return;
      aiTrump(seat);
    }, 600);
    return;
  }
  if(!authorizedFor(seat)){
    clearDecisionUI();
    setPanelMsg(`Waiting for ${seatLabel(seat)} to choose trump...`);
    return;
  }
  if(seat===MY_SEAT){ presentTrumpChoice(); return; }
  // For any other human (non-host) we wait; host already handled above.
}
function presentTrumpChoice(){
  setPanelMsg('Choosing trump...');
  setPanelBtns([]);
  const btns = SUITS.map(s=>({label:`${SUIT_SYM[s]} ${SUIT_NAME[s]}`, cls:'suit-'+s,
    fn:()=>{ hideOverlay(); setTrump(s); }}));
  btns.push({label:'2nd (blind pick)', cls:'ghost', fn:()=>{ hideOverlay(); startSecondOption(); }});
  showOverlay('You Won the Bid!', 'Secretly choose your trump suit, or use "2nd" to blind-pick trump from your next four cards instead — even you will not know which suit until you pick.', btns);
}
function startSecondOption(){
  const rd = G.round;
  const cards = rd.deck.splice(0,4);
  rd.pendingSecondOption = cards;
  rd.awaiting = {type:'trumpSecondPick', seat: MY_SEAT};
  logMsg(`${pname(MY_SEAT)} is choosing trump using the "2nd" option.`);
  announce(`${seatLabel(MY_SEAT)} is choosing trump via the "2nd" option`);
  pushState();
  doSecondOptionStep(MY_SEAT);
}
function doSecondOptionStep(seat){
  if(shouldHostAuto(seat)){
    // For auto-play, we just pick the first card's suit as trump (simple AI)
    setTimeout(()=>{
      if(!G || !G.round || G.round.awaiting.type!=='trumpSecondPick' || G.round.awaiting.seat!==seat) return;
      const rd = G.round;
      const cards = rd.pendingSecondOption;
      if(!cards) return;
      // AI: pick suit that matches their strongest existing hand
      const {suit} = handStrength(rd.hands[seat].concat(cards));
      const idx = cards.findIndex(c=>c.s===suit) >=0 ? cards.findIndex(c=>c.s===suit) : 0;
      finishSecondOption(idx);
    }, 600);
    return;
  }
  if(!authorizedFor(seat)){
    clearDecisionUI();
    setPanelMsg(`Waiting for ${seatLabel(seat)} to pick a face-down card...`);
    return;
  }
  if(seat!==MY_SEAT) return;
  presentSecondOptionPicker();
}
function presentSecondOptionPicker(){
  const cards = G.round.pendingSecondOption;
  if(!cards){ return; }
  setPanelMsg('Pick one face-down card to secretly set your trump suit.');
  document.getElementById('ovTitle').textContent = 'Choose a Face-Down Card';
  document.getElementById('ovText').textContent = 'Tap one — it will secretly become your trump suit.';
  const row = document.getElementById('ovBtns');
  row.innerHTML = '';
  const cardRow = document.createElement('div');
  cardRow.style.cssText = 'display:flex; gap:8px; justify-content:center; margin:8px 0;';
  cards.forEach((c,i)=>{
    const cb = document.createElement('div');
    cb.className = 'cardback';
    cb.style.cssText = 'width:52px; height:74px; margin-left:0; cursor:pointer; border-width:2px;';
    cb.addEventListener('click', ()=>{ finishSecondOption(i); });
    cardRow.appendChild(cb);
  });
  row.appendChild(cardRow);
  document.getElementById('overlay').classList.remove('hidden');
}
function finishSecondOption(idx){
  const rd = G.round;
  const cards = rd.pendingSecondOption;
  const chosen = cards[idx];
  const trumpCountTotal = rd.hands[MY_SEAT].filter(c=>c.s===chosen.s).length + cards.filter(c=>c.s===chosen.s).length;
  if(trumpCountTotal===1 && G.trumpMode==='show'){
    logMsg(`${pname(MY_SEAT)} only has one ${SUIT_NAME[chosen.s]} card across their whole 8-card hand — round cancelled (Show Trump rule).`);
    announce('Round cancelled — too little trump support from the "2nd" option.');
    rd.pendingSecondOption = null;
    rd.awaiting = {type:'redealAck', reason:'weakSecondOption', seat: MY_SEAT};
    pushState();
    showRedealOverlay();
    return;
  }
  rd.trump = chosen.s;
  rd.trumpRevealed = false;
  rd.secondOptionSeat = MY_SEAT;
  rd.secondOptionCards = cards;
  rd.pendingSecondOption = null;
  logMsg(`${pname(MY_SEAT)} secretly set trump via the "2nd" option.`);
  document.getElementById('ovTitle').textContent = 'Your Trump Card';
  document.getElementById('ovText').textContent = `Your trump suit is now ${SUIT_NAME[chosen.s]} — only you know this until it's revealed in play. Your other 3 cards from this draw will appear once the double/redouble step finishes.`;
  const row = document.getElementById('ovBtns');
  row.innerHTML = '';
  const cardWrap = document.createElement('div');
  cardWrap.style.cssText = 'display:flex; justify-content:center; margin:8px 0;';
  cardWrap.appendChild(cardEl(chosen, 'trickcard'));
  row.appendChild(cardWrap);
  const btn = document.createElement('button');
  btn.className = 'btn primary';
  btn.textContent = 'Continue';
  btn.style.marginTop = '6px';
  btn.addEventListener('click', ()=>{ hideOverlay(); startBidDoubleOffers(); });
  row.appendChild(btn);
}
function setTrump(suit){
  const rd = G.round;
  rd.trump = suit;
  rd.trumpRevealed = false;
  logMsg(`Trump chosen secretly by ${pname(rd.highBidder)}.`);
  startBidDoubleOffers();
}

/* ---------------- BID DOUBLE / REDOUBLE ---------------- */
function startBidDoubleOffers(){
  const rd = G.round;
  rd.bidMultiplier = 1;
  rd.bidDoubleSkipped = [];
  rd.awaiting = {type:'bidDoubleOffer', opponents:[nextSeat(rd.highBidder), prevSeat(rd.highBidder)]};
  pushState();
  doBidDoubleOfferStep();
}
function doBidDoubleOfferStep(){
  const rd = G.round;
  if(!rd.awaiting || rd.awaiting.type!=='bidDoubleOffer') return;
  const opponents = rd.awaiting.opponents;
  const skipped = rd.bidDoubleSkipped||[];
  // Host handles AI/auto opponents
  if(IS_HOST){
    let anyActionTaken = false;
    for(const opp of opponents){
      if(shouldHostAuto(opp) && !skipped.includes(opp)){
        anyActionTaken = true;
        setTimeout(()=>{
          if(!G || !G.round || G.round.awaiting.type!=='bidDoubleOffer') return;
          const rd2 = G.round;
          if((rd2.bidDoubleSkipped||[]).includes(opp)) return;
          if(aiBidDouble(opp)){
            rd2.bidMultiplier=2; rd2.bidDoubleBy=opp; logMsg(`${pname(opp)} doubles the bid!`);
            announce(`${seatLabel(opp)} doubles the bid!`);
            startRedoubleOffers();
          } else {
            rd2.bidDoubleSkipped = rd2.bidDoubleSkipped||[]; rd2.bidDoubleSkipped.push(opp);
            checkBidDoubleResolution();
          }
        }, 600+Math.random()*400);
      }
    }
    if(!anyActionTaken) return; // waiting for human opponents
  }
  // Human opponents: show prompt if it's my seat and not skipped
  if(opponents.includes(MY_SEAT) && !skipped.includes(MY_SEAT)){
    setPanelMsg('Double decision...');
    setPanelBtns([]);
    showOverlay('Double the Bid?', `${seatLabel(rd.highBidder)} bid ${rd.highBid}. Either opponent may double — win/loss becomes worth 2 points instead of 1.`, [
      {label:'Double', cls:'primary', fn:()=>{
        hideOverlay(); rd.bidMultiplier=2; rd.bidDoubleBy=MY_SEAT; logMsg(`${pname(MY_SEAT)} doubles the bid!`);
        announce(`${seatLabel(MY_SEAT)} doubles the bid!`);
        startRedoubleOffers();
      }},
      {label:'Skip', cls:'ghost', fn:()=>{
        hideOverlay(); logMsg('You skip doubling.');
        rd.bidDoubleSkipped = rd.bidDoubleSkipped||[]; rd.bidDoubleSkipped.push(MY_SEAT);
        checkBidDoubleResolution();
      }}
    ]);
    return;
  }
  if(!opponents.includes(MY_SEAT)){
    clearDecisionUI();
    setPanelMsg("Waiting for opponents' Double decision...");
  }
}
function checkBidDoubleResolution(){
  const rd = G.round;
  const opponents = rd.awaiting.opponents;
  const skipped = rd.bidDoubleSkipped||[];
  if(opponents.every(o=>skipped.includes(o))){
    dealRemaining();
  } else {
    pushState();
    doBidDoubleOfferStep();
  }
}
function startRedoubleOffers(){
  const rd = G.round;
  rd.redoubleSkipped = [];
  rd.awaiting = {type:'redoubleOffer', biddingSide:[rd.highBidder, PARTNER[rd.highBidder]]};
  pushState();
  doRedoubleOfferStep();
}
function doRedoubleOfferStep(){
  const rd = G.round;
  if(!rd.awaiting || rd.awaiting.type!=='redoubleOffer') return;
  const side = rd.awaiting.biddingSide;
  const skipped = rd.redoubleSkipped||[];
  if(IS_HOST){
    let anyActionTaken = false;
    for(const s of side){
      if(shouldHostAuto(s) && !skipped.includes(s)){
        anyActionTaken = true;
        setTimeout(()=>{
          if(!G || !G.round || G.round.awaiting.type!=='redoubleOffer') return;
          const rd2 = G.round;
          if((rd2.redoubleSkipped||[]).includes(s)) return;
          if(aiRedouble(s)){
            rd2.bidMultiplier=4; rd2.redoubleBy=s; logMsg(`${pname(s)} redoubles!`);
            announce(`${seatLabel(s)} redoubles! Bid now worth 4 points.`);
            dealRemaining();
          } else {
            rd2.redoubleSkipped = rd2.redoubleSkipped||[]; rd2.redoubleSkipped.push(s);
            checkRedoubleResolution();
          }
        }, 600+Math.random()*400);
      }
    }
    if(!anyActionTaken) return;
  }
  if(side.includes(MY_SEAT) && !skipped.includes(MY_SEAT)){
    setPanelMsg('Redouble decision...');
    setPanelBtns([]);
    showOverlay('Redouble?', 'The bid has been doubled. Either you or your partner may redouble — win/loss becomes worth 4 points instead of 2. Singles will not be offered this round if redoubled.', [
      {label:'Redouble', cls:'primary', fn:()=>{
        hideOverlay(); rd.bidMultiplier=4; rd.redoubleBy=MY_SEAT; logMsg(`${pname(MY_SEAT)} redoubles!`);
        announce(`${seatLabel(MY_SEAT)} redoubles! Bid now worth 4 points.`);
        dealRemaining();
      }},
      {label:'Skip', cls:'ghost', fn:()=>{
        hideOverlay(); logMsg('You skip redoubling.');
        rd.redoubleSkipped = rd.redoubleSkipped||[]; rd.redoubleSkipped.push(MY_SEAT);
        checkRedoubleResolution();
      }}
    ]);
    return;
  }
  if(!side.includes(MY_SEAT)){
    clearDecisionUI();
    setPanelMsg("Waiting for your team's Redouble decision...");
  }
}
function checkRedoubleResolution(){
  const rd = G.round;
  const side = rd.awaiting.biddingSide;
  const skipped = rd.redoubleSkipped||[];
  if(side.every(s=>skipped.includes(s))){
    dealRemaining();
  } else {
    pushState();
    doRedoubleOfferStep();
  }
}

function dealRemaining(){
  const rd = G.round;
  for(const seat of rd.order4){
    if(seat===rd.secondOptionSeat){
      rd.hands[seat].push(...rd.secondOptionCards);
      rd.secondOptionCards = null;
      continue;
    }
    rd.hands[seat].push(...rd.deck.splice(0,4));
  }

  for(const seat of [0,1,2,3]){
    const js = rd.hands[seat].filter(c=>c.r==='J').length;
    if(js===4){
      logMsg(`${pname(seat)} was dealt all four Jacks — round cancelled.`);
      rd.awaiting = {type:'redealAck', reason:'jacks', seat};
      pushState();
      showRedealOverlay();
      return;
    }
  }
  const partner = PARTNER[rd.highBidder];
  const teamTrumpCount = rd.hands[rd.highBidder].filter(c=>c.s===rd.trump).length
                       + rd.hands[partner].filter(c=>c.s===rd.trump).length;
  if(teamTrumpCount===0){
    logMsg('Bidding side has no trump cards at all — round cancelled.');
    rd.awaiting = {type:'redealAck', reason:'notrump', seat:rd.highBidder};
    pushState();
    showRedealOverlay();
    return;
  }
  if(teamTrumpCount===8){
    logMsg(`${pname(rd.highBidder)}'s side holds all 8 ${SUIT_NAME[rd.trump]} — opponents have none. Round cancelled.`);
    rd.awaiting = {type:'redealAck', reason:'alltrump', seat:rd.highBidder};
    pushState();
    showRedealOverlay();
    return;
  }
  for(const seat of [0,1,2,3]){
    if(seat===rd.first) continue;
    const pts = rd.hands[seat].reduce((sum,c)=>sum+RANK_POINTS[c.r],0);
    if(pts===0){
      logMsg(`${pname(seat)}'s full 8-card hand is worth 0 points — round cancelled.`);
      rd.awaiting = {type:'redealAck', reason:'noPointsHand', seat};
      pushState();
      showRedealOverlay();
      return;
    }
  }

  if(rd.bidMultiplier===4){
    logMsg('The bid was redoubled — Singles is not offered this round.');
    beginPlay();
    return;
  }
  rd.singlesSkipped = [];
  rd.awaiting = {type:'singlesOffer'};
  pushState();
  doSinglesOfferStep();
}

/* ---------------- SINGLES / DOUBLE ---------------- */
function doSinglesOfferStep(){
  const rd = G.round;
  if(!rd.awaiting || rd.awaiting.type!=='singlesOffer') return;
  const skipped = rd.singlesSkipped||[];
  if(IS_HOST){
    let anyActionTaken = false;
    for(const s of [0,1,2,3]){
      if(shouldHostAuto(s) && !skipped.includes(s)){
        anyActionTaken = true;
        setTimeout(()=>{
          if(!G || !G.round || G.round.awaiting.type!=='singlesOffer') return;
          const rd2 = G.round;
          if((rd2.singlesSkipped||[]).includes(s)) return;
          if(aiSingles(s)){
            rd2.singles = s;
            logMsg(`${pname(s)} goes Singles!`);
            announce(`${seatLabel(s)} chose to play Singles!`);
            afterSinglesDecided();
          } else {
            rd2.singlesSkipped = rd2.singlesSkipped||[]; rd2.singlesSkipped.push(s);
            announce(`${seatLabel(s)} chose No Single.`);
            checkSinglesResolution();
          }
        }, 600+Math.random()*400);
      }
    }
    if(!anyActionTaken) return;
  }
  if(!skipped.includes(MY_SEAT)){
    setPanelMsg('Singles decision...');
    setPanelBtns([]);
    showOverlay('Play Singles?', 'Any player may offer to play this round alone (Singles) — first to accept gets it. Go it alone for a shot at +3 game points, or risk -3 if you miss even one trick.', [
      {label:'Play Singles', cls:'primary', fn:()=>{
        hideOverlay(); rd.singles=MY_SEAT; logMsg('You go Singles.');
        announce('You chose to play Singles!'); afterSinglesDecided();
      }},
      {label:'No Single', cls:'ghost', fn:()=>{
        hideOverlay(); logMsg('You chose No Single.');
        rd.singlesSkipped = rd.singlesSkipped||[]; rd.singlesSkipped.push(MY_SEAT);
        checkSinglesResolution();
      }}
    ]);
    return;
  }
  if(skipped.includes(MY_SEAT)){
    clearDecisionUI();
    setPanelMsg("Waiting for the others' Singles decision...");
  }
}
function checkSinglesResolution(){
  const rd = G.round;
  if((rd.singlesSkipped||[]).length>=4){
    afterSinglesDecided();
  } else {
    pushState();
    doSinglesOfferStep();
  }
}
function afterSinglesDecided(){
  const rd = G.round;
  if(rd.singles==null){ beginPlay(); return; }
  const opponentSeat = nextSeat(rd.singles);
  rd.awaiting = {type:'double', seat: opponentSeat};
  pushState();
  doDoubleStep(opponentSeat);
}
function doDoubleStep(seat){
  if(shouldHostAuto(seat)){
    setTimeout(()=>{
      if(!G || !G.round || G.round.awaiting.type!=='double' || G.round.awaiting.seat!==seat) return;
      const rd = G.round;
      if(Math.random()<0.35){ rd.doubled=true; logMsg(`${pname(seat)} doubles the Singles bet.`); }
      beginPlay();
    }, 600);
    return;
  }
  if(!authorizedFor(seat)){
    clearDecisionUI();
    setPanelMsg(`Waiting for ${seatLabel(seat)}'s Double decision...`);
    return;
  }
  const rd = G.round;
  if(seat===MY_SEAT){
    setPanelMsg('Double decision...');
    setPanelBtns([]);
    showOverlay('Double the Stakes?', `${seatLabel(rd.singles)} is playing Singles. Double means their +3/-3 becomes +6/-6.`, [
      {label:'Double', cls:'primary', fn:()=>{ hideOverlay(); rd.doubled=true; logMsg('Double called.'); beginPlay(); }},
      {label:'No thanks', cls:'ghost', fn:()=>{ hideOverlay(); beginPlay(); } },
    ]);
    return;
  }
  // Should not reach for human non-authorised; host handles auto
}

/* ---------------- PLAY ---------------- */
function beginPlay(){
  const rd = G.round;
  rd.phase='play';
  if(rd.singles!=null){
    rd.leader = rd.singles;
    rd.originalTrump = rd.trump;
    rd.trump = null;
    rd.trumpRevealed = false;
  } else {
    rd.leader = rd.first;
  }
  rd.awaiting = {type:'play', seat: rd.leader};
  pushState();
  playTurn(rd.leader);
}
function currentBestTrumpRank(rd){
  if(!rd.trumpRevealed) return null;
  let best = null;
  for(const s of Object.keys(rd.current)){
    const c = rd.current[s];
    if(c.s===rd.trump){
      const r = rankIdx(c.r);
      if(best===null || r>best) best = r;
    }
  }
  return best;
}
function legalCards(seat){
  const rd = G.round;
  const hand = rd.hands[seat];
  const ledSuit = rd.leadSuit;
  if(!ledSuit) return hand.slice();
  const followers = hand.filter(c=>c.s===ledSuit);
  if(followers.length>0) return followers;
  const bestTrumpRank = currentBestTrumpRank(rd);
  if(bestTrumpRank!=null){
    const overOrSafe = hand.filter(c=> c.s!==rd.trump || rankIdx(c.r)>bestTrumpRank);
    if(overOrSafe.length>0) return overOrSafe;
  }
  return hand.slice();
}
function seatOutOfPlay(seat){
  const rd = G.round;
  if(rd.singles==null) return false;
  return seat===PARTNER[rd.singles];
}
function legalIsDiscardOnly(seat){
  const rd = G.round;
  const hand = rd.hands[seat];
  if(!rd.leadSuit) return false;
  return !hand.some(c=>c.s===rd.leadSuit);
}
let TRUMP_ATTEMPT_MODE = false;
function presentHumanPlay(legal){
  const rd = G.round;
  if(rd.forcedTrumpFor===MY_SEAT){
    const trumpCards = legal.filter(c=>c.s===rd.trump);
    setPanelBtns([]);
    setCenterActions([]);
    if(trumpCards.length>0){
      setPanelMsg(`Trump revealed: ${SUIT_NAME[rd.trump]} — you have trump, so you must play it.`);
      setPlayable(trumpCards.map(c=>c.id));
    } else {
      setPanelMsg(`Trump revealed: ${SUIT_NAME[rd.trump]}, but you have none — play any card.`);
      setPlayable(legal.map(c=>c.id));
    }
    return;
  }
  const isVoid = rd.leadSuit && legalIsDiscardOnly(MY_SEAT) && !rd.trumpRevealed;
  if(isVoid){
    setPanelMsg(`You have no ${SUIT_NAME[rd.leadSuit]}.`);
    setPanelBtns([]);
    setPlayable([]);
    setCenterActions([
      {label:'Trump', cls:'primary', fn:()=>{
        if(G.trumpMode==='show'){
          rd.trumpRevealed = true;
          const trumpCards = legal.filter(c=>c.s===rd.trump);
          if(trumpCards.length>0) rd.forcedTrumpFor = MY_SEAT;
          logMsg(`${pname(MY_SEAT)} chose to Trump — trump revealed: ${SUIT_SYM[rd.trump]} ${SUIT_NAME[rd.trump]}.`);
          announce(`Trump revealed: ${SUIT_SYM[rd.trump]} ${SUIT_NAME[rd.trump]}`);
          pushState();
          setCenterActions([]);
          if(trumpCards.length>0){
            setPanelMsg(`Trump revealed: ${SUIT_NAME[rd.trump]} — you have trump, so you must play it.`);
            setPlayable(trumpCards.map(c=>c.id));
          } else {
            setPanelMsg(`Trump revealed: ${SUIT_NAME[rd.trump]}, but you have none — play any card.`);
            setPlayable(legal.map(c=>c.id));
          }
          return;
        }
        TRUMP_ATTEMPT_MODE = true;
        setPanelMsg('Choose one of your own cards to attempt trump with.');
        setCenterActions([]);
        setPlayable(legal.map(c=>c.id));
      }},
      {label:"Don't Trump", cls:'ghost', fn:()=>{
        TRUMP_ATTEMPT_MODE = false;
        setPanelMsg('Choose any card to discard safely.');
        setCenterActions([]);
        setPlayable(legal.map(c=>c.id));
      }}
    ]);
    return;
  }
  TRUMP_ATTEMPT_MODE = false;
  if(rd.leadSuit && legalIsDiscardOnly(MY_SEAT) && rd.trumpRevealed){
    setPanelMsg(`You have no ${SUIT_NAME[rd.leadSuit]} — tap any card to play, or a ${SUIT_NAME[rd.trump]} to trump in.`);
  } else {
    setPanelMsg('Your turn — tap a highlighted card to play it.');
  }
  setPanelBtns([]);
  setPlayable(legal.map(c=>c.id));
  const trumpKQ = rd.trumpRevealed
    ? rd.hands[MY_SEAT].filter(c=>c.s===rd.trump && (c.r==='K'||c.r==='Q'))
    : [];
  const myTeam = TEAM[MY_SEAT];
  const myTeamWonTrick = rd.tricks.some(t=>TEAM[t.winner]===myTeam);
  const btns = [];
  if(rd.trumpRevealed && trumpKQ.length===2 && myTeamWonTrick && !rd.pairDeclared[myTeam]){
    btns.push({label:'Declare Pair (+4)', cls:'primary', fn:()=>{
      rd.pairDeclared[myTeam]=true;
      rd.pairDeclaredBy = MY_SEAT;
      logMsg(`${pname(MY_SEAT)} declares the pair (King+Queen of trump) — +4 bonus noted.`);
      announce(`${pname(MY_SEAT)} declares the pair! +4 bonus`);
      pushState();
      presentHumanPlay(legal);
    }});
  }
  setCenterActions(btns);
}
function playTurn(seat){
  const rd = G.round;
  if(seatOutOfPlay(seat)){ playTurn(nextSeat(seat)); return; }
  rd.awaiting = {type:'play', seat};
  const legal = legalCards(seat);
  if(legal.length===1){
    if(!authorizedFor(seat)) return;
    playCard(seat, legal[0]);
    return;
  }
  if(shouldHostAuto(seat)){
    setTimeout(()=>{
      if(!G || !G.round || G.round.awaiting.type!=='play' || G.round.awaiting.seat!==seat) return;
      aiPlay(seat, legalCards(seat));
    }, 700);
    return;
  }
  if(!authorizedFor(seat)){
    clearDecisionUI();
    setPanelMsg(`Waiting for ${seatLabel(seat)}...`);
    setPlayable([]);
    return;
  }
  if(seat===MY_SEAT){ presentHumanPlay(legal); }
  else { setTimeout(()=>{
    if(!G || !G.round || G.round.awaiting.type!=='play' || G.round.awaiting.seat!==seat) return;
    // This should not happen for human non-host; but if host, shouldHostAuto already handled
    if(IS_HOST) aiPlay(seat, legalCards(seat));
  }, 700); }
}
function playCard(seat, card, opts){
  opts = opts || {};
  const skipTrumpCheck = (seat===MY_SEAT) ? !TRUMP_ATTEMPT_MODE : !!opts.skipTrumpCheck;
  TRUMP_ATTEMPT_MODE = false;
  const rd = G.round;
  if(rd.forcedTrumpFor===seat) rd.forcedTrumpFor = null;
  rd.hands[seat] = rd.hands[seat].filter(c=>c.id!==card.id);
  rd.current[seat] = card;
  rd.playOrder = rd.playOrder || [];
  rd.playOrder.push(seat);
  const hadLeadSuit = rd.leadSuit;
  if(!rd.leadSuit) rd.leadSuit = card.s;
  logMsg(`${pname(seat)} plays ${card.r}${SUIT_SYM[card.s]}.`);

  if(rd.singles!=null && !hadLeadSuit && rd.trump===null){
    rd.trump = card.s;
    rd.trumpRevealed = true;
    logMsg(`${pname(seat)} leads ${SUIT_NAME[card.s]} — this is the Single Trump colour for this round!`);
    announce(`Single Trump colour: ${SUIT_SYM[card.s]} ${SUIT_NAME[card.s]}`);
    const oppSeats = [0,1,2,3].filter(s=>TEAM[s]!==TEAM[rd.singles]);
    const anyOppHasSuit = oppSeats.some(s=>rd.hands[s].some(c=>c.s===rd.trump));
    if(!anyOppHasSuit){
      logMsg('Neither opponent holds the Single Trump colour — Singles is automatically cancelled. Reverting to normal play.');
      announce('Singles cancelled — neither opponent holds that suit!');
      rd.hands[seat].push(card);
      delete rd.current[seat];
      rd.playOrder = [];
      rd.leadSuit = null;
      rd.singles = null;
      rd.doubled = false;
      rd.trump = rd.originalTrump;
      rd.trumpRevealed = false;
      rd.leader = rd.first;
      rd.awaiting = {type:'play', seat: rd.first};
      pushState();
      playTurn(rd.first);
      return;
    }
  }
  const wasAttempt = !skipTrumpCheck;
  if(rd.singles==null && hadLeadSuit && card.s!==hadLeadSuit && !rd.trumpRevealed && wasAttempt){
    rd.trumpRevealed = true;
    if(card.s===rd.trump){
      logMsg(`${pname(seat)} trumps in! Trump revealed: ${SUIT_SYM[rd.trump]} ${SUIT_NAME[rd.trump]}!`);
      announce(`${seatLabel(seat)} trumps in! Trump is ${SUIT_SYM[rd.trump]} ${SUIT_NAME[rd.trump]}`);
    } else {
      logMsg(`${pname(seat)} attempted trump with ${card.r}${SUIT_SYM[card.s]} — not a match, but trump is now revealed: ${SUIT_SYM[rd.trump]} ${SUIT_NAME[rd.trump]}.`);
      announce(`${seatLabel(seat)} attempted trump — revealed: ${SUIT_SYM[rd.trump]} ${SUIT_NAME[rd.trump]}`);
    }
  }
  const playedSeats = Object.keys(rd.current).map(Number);
  const outCount = rd.singles!=null ? 1 : 0;
  if(playedSeats.length + outCount === 4){
    rd.awaiting = {type:'trickPause'};
    pushState();
    setTimeout(resolveTrick, 2000);
  } else {
    playTurn(nextSeat(seat));
    pushState();
  }
}
function beats(card, currentBest, rd){
  const trump = rd.trumpRevealed ? rd.trump : null;
  const cIsTrump = trump && card.s===trump;
  const bIsTrump = trump && currentBest.s===trump;
  if(cIsTrump && !bIsTrump) return true;
  if(!cIsTrump && bIsTrump) return false;
  if(cIsTrump && bIsTrump) return rankIdx(card.r) > rankIdx(currentBest.r);
  if(card.s!==currentBest.s) return false;
  return rankIdx(card.r) > rankIdx(currentBest.r);
}
function resolveTrick(){
  const rd = G.round;
  const entries = rd.playOrder.map(s=>({seat:s, card:rd.current[s]}));
  let winner = entries[0];
  for(const e of entries.slice(1)) winner = beats(e.card, winner.card, rd) ? e : winner;
  const pts = entries.reduce((sum,e)=>sum+RANK_POINTS[e.card.r],0);
  const team = TEAM[winner.seat];
  if(team==='A') rd.pointsA += pts; else rd.pointsB += pts;
  rd.tricks.push({winner:winner.seat, cards:entries, pts});
  logMsg(`${pname(winner.seat)} wins the trick (${pts} pts).`);

  rd.current = {}; rd.leadSuit = null; rd.playOrder = []; rd.trickNo++;

  if(rd.singles!=null && rd.trickNo===2 && !rd.partnerRevealShown){
    rd.partnerRevealShown = true;
    logMsg(`${pname(rd.singles)} may now view their partner's hand once.`);
  }

  if(rd.singles!=null && TEAM[winner.seat]!==TEAM[rd.singles]){
    logMsg(`${pname(winner.seat)} (opponent) won a trick — Singles has already failed, ending the round early.`);
    announce(`${seatLabel(winner.seat)} won a trick — Singles fails, round ends early.`);
    rd.awaiting = {type:'trickPause'};
    pushState();
    setTimeout(()=>{ try{ endRound(); }catch(e){ console.error('endRound failed', e); } }, 400);
    return;
  }

  const cardCountSeat = (rd.singles!=null) ? rd.singles : rd.first;
  const cardsLeft = rd.hands[cardCountSeat].length;
  if(cardsLeft===0){
    rd.awaiting = {type:'trickPause'};
    pushState();
    setTimeout(()=>{ try{ endRound(); }catch(e){ console.error('endRound failed', e); } }, 400);
  } else {
    rd.leader = winner.seat;
    rd.awaiting = {type:'play', seat: winner.seat};
    pushState();
    setTimeout(()=>playTurn(winner.seat), 100);
  }
}

/* ---------------- ROUND END / SCORING ---------------- */
function applyGamePoints(team, pts){
  const other = team==='A' ? 'B' : 'A';
  const current = team==='A' ? G.scoreA : G.scoreB;
  if(pts<0){
    const newVal = current + pts;
    if(newVal<0){
      const overflow = -newVal;
      if(team==='A'){ G.scoreA = 0; G.scoreB += overflow; }
      else { G.scoreB = 0; G.scoreA += overflow; }
      const teamNames = team==='A' ? (seatLabel(0)+' & '+seatLabel(2)) : (seatLabel(1)+' & '+seatLabel(3));
      const otherNames = other==='A' ? (seatLabel(0)+' & '+seatLabel(2)) : (seatLabel(1)+' & '+seatLabel(3));
      logMsg(`${teamNames} would have dropped below 0 — the ${overflow} extra point(s) go to ${otherNames} instead.`);
    } else {
      if(team==='A') G.scoreA = newVal; else G.scoreB = newVal;
    }
  } else {
    if(team==='A') G.scoreA += pts; else G.scoreB += pts;
  }
}
function endRound(){
  const rd = G.round;
  if(!rd.trumpRevealed){
    logMsg('The round finished without the trump suit ever being shown — round cancelled.');
    rd.awaiting = {type:'redealAck', reason:'notrumpshown', seat:rd.highBidder};
    pushState();
    return;
  }

  const countA = rd.tricks.filter(t=>TEAM[t.winner]==='A').length;
  const countB = rd.tricks.filter(t=>TEAM[t.winner]==='B').length;
  const sweepTeam = countA===8 ? 'A' : countB===8 ? 'B' : null;

  if(rd.singles==null && rd.bidMultiplier===4 && sweepTeam){
    logMsg(`${sweepTeam==='A'?pname(0)+' & '+pname(2):pname(1)+' & '+pname(3)} swept all 8 tricks on a redoubled round — too extreme, round cancelled.`);
    rd.awaiting = {type:'redealAck', reason:'redoubleSweep', seat:rd.highBidder};
    pushState();
    return;
  }

  const bidTeam = TEAM[rd.highBidder];
  const oppTeam = bidTeam==='A' ? 'B' : 'A';
  const bidTeamPts = bidTeam==='A' ? rd.pointsA : rd.pointsB;
  let effectiveBidTeamPts = bidTeamPts;
  if(rd.pairDeclared[bidTeam]) effectiveBidTeamPts += 4;
  if(rd.pairDeclared[oppTeam]) effectiveBidTeamPts -= 4;
  const madeIt = effectiveBidTeamPts >= rd.highBid;

  let overText, pairNote = '';
  if(rd.pairDeclared[bidTeam]) pairNote += ` ${seatLabel(rd.highBidder)}'s side declared the pair — needed only ${Math.max(0, rd.highBid-4)} real card points instead of ${rd.highBid}.`;
  if(rd.pairDeclared[oppTeam]){
    const oppNames = oppTeam==='A' ? (seatLabel(0)+' & '+seatLabel(2)) : (seatLabel(1)+' & '+seatLabel(3));
    pairNote += ` ${oppNames} declared the pair — effectively worth +4 against the bid.`;
  }

  if(rd.singles!=null){
    const wonAll = rd.tricks.every(t=>t.winner===rd.singles);
    let pts = wonAll ? 3 : -3;
    if(rd.doubled) pts *= 2;
    const singlesTeam = TEAM[rd.singles];
    const oppTeam = singlesTeam==='A' ? 'B' : 'A';
    if(wonAll){
      applyGamePoints(singlesTeam, Math.abs(pts));
    } else {
      applyGamePoints(oppTeam, Math.abs(pts));
    }
    const singlesNote = ` ${seatLabel(rd.singles)} played Singles and ${wonAll?'took every trick':'missed at least one trick'} — ${wonAll?'their side':'the opponents'} score ${Math.abs(pts)} point(s)${rd.doubled?' (doubled)':''}.`;
    overText = `Singles round.${singlesNote}${pairNote}`;
    logMsg('Round over. '+overText);
    G.roundHistory = G.roundHistory || [];
    G.roundHistory.push({
      n: G.roundHistory.length+1, bidder: seatLabel(rd.highBidder), bidTeam,
      bid: rd.highBid, took: bidTeamPts, madeIt: wonAll, mult: rd.bidMultiplier||1,
      singlesPlayer: seatLabel(rd.singles), sweepTeam: null, scoreA: G.scoreA, scoreB: G.scoreB,
    });
    rd.awaiting = {type:'roundEndAck', overText};
    pushState();
    return;
  }

  let gamePts = (madeIt ? 1 : -1) * (rd.bidMultiplier||1);

  let sweepNote = '';
  if(rd.bidMultiplier!==4 && sweepTeam){
    applyGamePoints(sweepTeam, 1);
    const sweepNames = sweepTeam==='A' ? (seatLabel(0)+' & '+seatLabel(2)) : (seatLabel(1)+' & '+seatLabel(3));
    sweepNote = ` ${sweepNames} swept all 8 tricks — +1 bonus point!`;
  }

  applyGamePoints(bidTeam, gamePts);

  if(G.boardMode==='double'){
    if(madeIt) G.boxes[bidTeam].red = true; else G.boxes[bidTeam].black = true;
  }

  let milestoneNote = '';
  if(G.scoreA>0 && G.scoreA%6===0) milestoneNote += ` 🎉 ${seatLabel(0)} & ${seatLabel(2)} have reached ${G.scoreA} points!`;
  if(G.scoreB>0 && G.scoreB%6===0) milestoneNote += ` 🎉 ${seatLabel(1)} & ${seatLabel(3)} have reached ${G.scoreB} points!`;

  const multNote = rd.bidMultiplier===4 ? ' (Redoubled — ×4!)' : rd.bidMultiplier===2 ? ' (Doubled — ×2)' : '';
  overText = `${seatLabel(rd.highBidder)}'s side needed ${rd.highBid} and took ${bidTeamPts} card points — ${madeIt?'bid made':'bid failed'}${multNote}.${pairNote}${sweepNote}${milestoneNote}`;
  logMsg('Round over. '+overText);

  G.roundHistory = G.roundHistory || [];
  G.roundHistory.push({
    n: G.roundHistory.length+1,
    bidder: seatLabel(rd.highBidder),
    bidTeam,
    bid: rd.highBid,
    took: bidTeamPts,
    madeIt,
    mult: rd.bidMultiplier||1,
    singlesPlayer: null,
    sweepTeam,
    scoreA: G.scoreA,
    scoreB: G.scoreB,
  });

  rd.awaiting = {type:'roundEndAck', overText};
  pushState();
}

/* ---------------- RENDERING ---------------- */
function renderTrumpSeed(){
  // The floating trump badge was prone to overlapping trick cards on some
  // screen sizes. Trump status now shows as text in the seat's name pill
  // instead (see seatStatusSuffix), so this element stays permanently hidden.
  const el = document.getElementById('trumpSeed');
  if(el) el.classList.add('hidden');
}
function cardEl(card, extraClass){
  const div = document.createElement('div');
  const isRed = RED_SUITS.includes(card.s);
  div.className = `card ${isRed?'red':''} ${extraClass||''}`;
  div.innerHTML = `<div class="rank">${card.r}${SUIT_SYM[card.s]}</div><div class="suit">${SUIT_SYM[card.s]}</div><div class="rank bottom">${card.r}${SUIT_SYM[card.s]}</div>`;
  div.dataset.id = card.id;
  return div;
}
function setPlayable(ids){ PLAYABLE_IDS = ids || []; renderHand(); }
function renderHand(){
  const row = document.getElementById('handRow');
  row.innerHTML='';
  if(!G || !G.round || MY_SEAT==null) return;
  const hand = (G.round.hands[MY_SEAT]||[]).slice().sort((a,b)=>{
    if(a.s!==b.s) return SUITS.indexOf(a.s)-SUITS.indexOf(b.s);
    return rankIdx(a.r)-rankIdx(b.r);
  });
  for(const c of hand){
    const playable = PLAYABLE_IDS.includes(c.id);
    const el = cardEl(c, playable? 'playable':'disabled');
    if(playable){
      el.addEventListener('click', ()=>{ setPlayable([]); setPanelMsg('Playing...'); playCard(MY_SEAT, c); });
    }
    row.appendChild(el);
  }
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function seatStatusSuffix(seat, rd){
  let s = '';
  if(rd.highBidder===seat && rd.highBid) s += ` (${rd.highBid})`;
  if(rd.bidDoubleBy===seat) s += ' 🔷×2';
  if(rd.redoubleBy===seat) s += ' 🔶×4';
  if(rd.singles===seat) s += ' 🃏S';
  if(rd.pairDeclaredBy===seat) s += ' 👑P';
  if(rd.highBidder===seat && rd.trump){
    const isRed = RED_SUITS.includes(rd.trump);
    const suitHtml = `<span style="font-size:19px;font-weight:800;color:${isRed?'#e05a5a':'#f3ead8'};vertical-align:-2px;">${SUIT_SYM[rd.trump]}</span>`;
    if(rd.trumpRevealed) s += ' '+suitHtml;
    else if(MY_SEAT===seat) s += ' '+suitHtml+'<span style="font-size:10px;">🔒</span>';
    else s += ' 🂠';
  }
  return s;
}
function renderTable(){
  if(!G || !G.round || MY_SEAT==null) return;
  const rd = G.round;

  // Trick slots first and unconditionally — this is the most visually
  // important part, and must never be left stale by an error elsewhere below.
  try {
    ['Bottom','Left','Top','Right'].forEach(slot=>{
      const seat = [0,1,2,3].find(s=>slotOf(s)===slot);
      const slotEl = document.getElementById('slot'+slot);
      slotEl.innerHTML='';
      const card = rd.current[seat];
      if(card) slotEl.appendChild(cardEl(card,'trickcard'));
    });
  } catch(e){ console.error('trick slot render failed', e); }

  try {
    ['Left','Top','Right'].forEach(slot=>{
      const seat = [0,1,2,3].find(s=>slotOf(s)===slot);
      const wrap = document.getElementById('cb'+slot);
      wrap.innerHTML='';
      const n = rd.hands[seat] ? rd.hands[seat].length : 0;
      for(let i=0;i<n;i++){ const b=document.createElement('div'); b.className='cardback'; wrap.appendChild(b); }
      document.getElementById('seat'+slot).querySelector('.name').innerHTML =
        escapeHtml(seatLabel(seat)) + seatStatusSuffix(seat, rd);
    });
    // Fix: use MY_SEAT for bottom seat status
    document.getElementById('seatBottom').querySelector('.name').innerHTML =
      'You' + seatStatusSuffix(MY_SEAT, rd);
  } catch(e){ console.error('seat label render failed', e); }

  try {
    ['Bottom','Left','Top','Right'].forEach(slot=>{
      document.getElementById('seat'+slot).classList.remove('active','bidder','dealer');
    });
    if(rd.highBidder!=null) document.getElementById('seat'+slotOf(rd.highBidder)).classList.add('bidder');
    if(G.dealer!=null) document.getElementById('seat'+slotOf(G.dealer)).classList.add('dealer');
    if(rd.awaiting && (rd.awaiting.type==='bid' || rd.awaiting.type==='play') && rd.awaiting.seat!=null){
      document.getElementById('seat'+slotOf(rd.awaiting.seat)).classList.add('active');
    }
  } catch(e){ console.error('seat class render failed', e); }

  try { renderTrumpSeed(); } catch(e){ console.error('trump seed render failed', e); }
}
function renderScore(){
  document.getElementById('scoreA').textContent = G.scoreA;
  document.getElementById('scoreB').textContent = G.scoreB;
  const single = G.boardMode==='single';
  document.getElementById('podA').classList.toggle('hidden', single);
  document.getElementById('podB').classList.toggle('hidden', single);
  document.getElementById('podUnified').classList.toggle('hidden', !single);
  if(single){
    const diff = G.scoreA - G.scoreB;
    const lblEl = document.getElementById('unifiedLabel');
    const valEl = document.getElementById('unifiedScore');
    if(diff===0){
      lblEl.textContent = 'Score';
      valEl.textContent = 0;
    } else if(diff>0){
      lblEl.textContent = seatLabel(0)+' & '+seatLabel(2);
      valEl.textContent = diff;
    } else {
      lblEl.textContent = seatLabel(1)+' & '+seatLabel(3);
      valEl.textContent = -diff;
    }
  }
}
function renderBoardStrip(){
  const el = document.getElementById('boardstrip');
  el.innerHTML='';
  if(!G || G.boardMode!=='double') return;
  ['A','B'].forEach(team=>{
    const label = document.createElement('div'); label.className='boxlabel';
    label.textContent = team==='A' ? (seatLabel(0)+' & '+seatLabel(2)) : (seatLabel(1)+' & '+seatLabel(3));
    const box = document.createElement('div'); box.className='box';
    const red = document.createElement('div'); red.className='cell red'+(G.boxes[team].red?' filled':'');
    const blk = document.createElement('div'); blk.className='cell black'+(G.boxes[team].black?' filled':'');
    box.appendChild(red); box.appendChild(blk);
    el.appendChild(label); el.appendChild(box);
  });
}
function renderLog(){
  const box = document.getElementById('logLines');
  box.innerHTML='';
  if(!G || !G.round || !G.round.log) return;
  for(const line of G.round.log){
    const d = document.createElement('div'); d.textContent=line; box.appendChild(d);
  }
}
function renderHistory(){
  const box = document.getElementById('historyLines');
  box.innerHTML='';
  if(!G || !G.roundHistory || G.roundHistory.length===0){
    const d = document.createElement('div');
    d.textContent = 'No rounds completed yet.';
    box.appendChild(d);
    return;
  }
  for(const r of G.roundHistory.slice().reverse()){
    const d = document.createElement('div');
    const bidTeamNames = r.bidTeam==='A' ? (seatLabel(0)+' & '+seatLabel(2)) : (seatLabel(1)+' & '+seatLabel(3));
    const multTxt = r.mult===4 ? ' (×4 redoubled)' : r.mult===2 ? ' (×2 doubled)' : '';
    let scoreTxt;
    if(G.boardMode==='single'){
      const diff = r.scoreA - r.scoreB;
      scoreTxt = diff===0 ? '0' : diff>0 ? `${seatLabel(0)} & ${seatLabel(2)} ❤️ ${diff}` : `${seatLabel(1)} & ${seatLabel(3)} ❤️ ${-diff}`;
    } else {
      scoreTxt = `A: ${r.scoreA} — B: ${r.scoreB}`;
    }
    d.innerHTML = `<b>Round ${r.n}:</b> ${r.bidder} (${bidTeamNames}) bid ${r.bid}, took ${r.took}${multTxt} — ${r.madeIt?'made':'failed'}`
      + (r.singlesPlayer ? `<br>Singles: ${r.singlesPlayer}` : '')
      + (r.sweepTeam ? `<br>🎉 Sweep by ${r.sweepTeam==='A'?seatLabel(0)+' & '+seatLabel(2):seatLabel(1)+' & '+seatLabel(3)}` : '')
      + `<br>Score after: ${scoreTxt}`;
    box.appendChild(d);
  }
}
function renderAll(){
  const steps = [renderScore, renderBoardStrip, renderTable, renderHand, renderLog, renderHistory, checkToast, checkPartnerReveal, checkCancelVotes, checkCancelRoundPrompt];
  for(const fn of steps){
    try { fn(); } catch(e){ console.error((fn.name||'render step')+' failed', e); }
  }
}
let partnerRevealShownLocally = false;
function checkPartnerReveal(){
  if(!G || !G.round || MY_SEAT==null) return;
  const rd = G.round;
  if(rd.singles===MY_SEAT && rd.partnerRevealShown && !partnerRevealShownLocally){
    partnerRevealShownLocally = true;
    const partnerSeat = PARTNER[MY_SEAT];
    const hand = (rd.hands[partnerSeat]||[]).slice().sort((a,b)=>{
      if(a.s!==b.s) return SUITS.indexOf(a.s)-SUITS.indexOf(b.s);
      return rankIdx(a.r)-rankIdx(b.r);
    });
    document.getElementById('ovTitle').textContent = "Your Partner's Hand";
    document.getElementById('ovText').textContent = "A one-time look — this won't be shown again this round.";
    const row = document.getElementById('ovBtns');
    row.innerHTML = '';
    const cardRow = document.createElement('div');
    cardRow.style.cssText = 'display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:8px 0;';
    for(const c of hand) cardRow.appendChild(cardEl(c, 'trickcard'));
    row.appendChild(cardRow);
    const btn = document.createElement('button');
    btn.className = 'btn primary';
    btn.textContent = 'Close';
    btn.style.marginTop = '8px';
    btn.addEventListener('click', hideOverlay);
    row.appendChild(btn);
    document.getElementById('overlay').classList.remove('hidden');
  }
}

/* ---------------- OVERLAYS (host-gated where noted) ---------------- */
function overlayBtnList(realBtns, requireHost){
  if(!requireHost || IS_HOST) return realBtns;
  return [{label:'Waiting for host…', cls:'ghost', fn:()=>{}}];
}
function showRedealOverlay(){
  const rd = G.round;
  const reasonText = rd.awaiting.reason==='jacks'
    ? `${seatLabel(rd.awaiting.seat)} held all four Jacks.`
    : rd.awaiting.reason==='notrumpshown'
    ? `The trump suit was never shown during play.`
    : rd.awaiting.reason==='redoubleSweep'
    ? `One side swept all 8 tricks on a redoubled round — too extreme to score.`
    : rd.awaiting.reason==='weakSecondOption'
    ? `${seatLabel(rd.awaiting.seat)} only has one card of that suit across their whole 8-card hand — too little trump support (Show Trump rule).`
    : rd.awaiting.reason==='firstBidderNoPoints'
    ? `${seatLabel(rd.awaiting.seat)} (first to bid) was dealt four cards worth 0 points.`
    : rd.awaiting.reason==='noPointsHand'
    ? `${seatLabel(rd.awaiting.seat)}'s full 8-card hand is worth 0 points.`
    : rd.awaiting.reason==='alltrump'
    ? `${seatLabel(rd.awaiting.seat)}'s side holds all 8 trump cards — the opponents have none.`
    : `${seatLabel(rd.awaiting.seat)}'s side had no trump cards at all.`;
  showOverlay('Round Cancelled', reasonText+' Re-dealing with the next dealer.',
    overlayBtnList([{label:'Continue', cls:'primary', fn:()=>{
      hideOverlay(); G.dealer = nextSeat(G.dealer); hostStartRound();
    }}], true));
}
function showRoundEndOverlay(){
  const rd = G.round;
  rd.readyNext = rd.readyNext || [];
  if(IS_HOST && humanSeatsList().every(s=>rd.readyNext.includes(s))){
    G.dealer = nextSeat(G.dealer);
    hostStartRound();
    return;
  }
  const myReady = rd.readyNext.includes(MY_SEAT);
  const readyNames = rd.readyNext.map(s=>seatLabel(s)).join(', ') || 'nobody yet';
  const btns = [];
  if(!myReady){
    btns.push({label:'Next Round', cls:'primary', fn:()=>{
      rd.readyNext.push(MY_SEAT);
      logMsg(`${pname(MY_SEAT)} is ready for the next round.`);
      if(IS_HOST && humanSeatsList().every(s=>rd.readyNext.includes(s))){
        G.dealer = nextSeat(G.dealer);
        hostStartRound();
      } else {
        pushState();
        showRoundEndOverlay();
      }
    }});
  }
  btns.push({label:'View Log', cls:'ghost', fn:()=>{ document.getElementById('logBox').classList.add('show'); }});
  if(IS_HOST){
    btns.push({label:'Force Next Round', cls:'ghost', fn:()=>{
      if(confirm('Skip waiting and start the next round now?')){
        G.dealer = nextSeat(G.dealer);
        hostStartRound();
      }
    }});
  }
  const readyText = myReady ? `\n\nWaiting on everyone else... (ready: ${readyNames})` : `\n\nReady so far: ${readyNames}`;
  showOverlay('Round Result', G.round.awaiting.overText+readyText, btns);
}
function showMatchEndOverlay(){
  const winnerTeam = G.round.awaiting.winnerTeam;
  const winnerNames = winnerTeam==='A' ? (seatLabel(0)+' & '+seatLabel(2)) : (seatLabel(1)+' & '+seatLabel(3));
  showOverlay(G.boardMode==='single' ? `${winnerNames} — 6 Love!` : 'Match Won',
    `${winnerNames} reached 6 points first and win the match.`,
    overlayBtnList([{label:'Play Again', cls:'primary', fn:()=>{ hideOverlay(); replayMatch(); }}], true));
}
function replayMatch(){
  G = { dealer:0, scoreA:0, scoreB:0, boardMode:G.boardMode, trumpMode:G.trumpMode, boxes:{A:{red:false,black:false},B:{red:false,black:false}}, matchOver:false, roundHistory:[] };
  hostStartRound();
}
function cancelRound(){
  logMsg('Round cancelled by host — re-dealing with the same dealer.');
  hostStartRound();
}

/* ---------------- PANEL / OVERLAY HELPERS ---------------- */
function setPanelMsg(t){ document.getElementById('panelMsg').textContent = t; }
function setPanelBtns(list){
  const row = document.getElementById('panelBtns');
  row.innerHTML='';
  for(const b of list){
    const btn = document.createElement('button');
    btn.className = 'btn '+(b.cls||'');
    btn.textContent = b.label;
    btn.addEventListener('click', b.fn);
    row.appendChild(btn);
  }
}
function setCenterActions(list){
  const row = document.getElementById('centerActions');
  row.innerHTML='';
  for(const b of list){
    const btn = document.createElement('button');
    btn.className = 'btn '+(b.cls||'');
    btn.textContent = b.label;
    btn.addEventListener('click', b.fn);
    row.appendChild(btn);
  }
}
let lastToastId = null;
function checkToast(){
  if(!G || !G.round || !G.round.announcement) return;
  const ann = G.round.announcement;
  if(ann.id===lastToastId) return;
  lastToastId = ann.id;
  const el = document.getElementById('tableToast');
  el.textContent = ann.text;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 3000);
}
function announce(text){
  G.round.announcement = {id: Date.now()+'-'+Math.random(), text};
}
function clearDecisionUI(){
  setPanelBtns([]);
  setCenterActions([]);
  hideOverlay();
  PLAYABLE_IDS = [];
}
function showOverlay(title, text, btns){
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovText').textContent = text;
  const row = document.getElementById('ovBtns');
  row.innerHTML='';
  for(const b of btns){
    const btn = document.createElement('button');
    btn.className='btn '+(b.cls||'');
    btn.textContent=b.label;
    btn.addEventListener('click', b.fn);
    row.appendChild(btn);
  }
  document.getElementById('overlay').classList.remove('hidden');
}
function hideOverlay(){ document.getElementById('overlay').classList.add('hidden'); }

/* ---------------- CONNECTION STATUS & REFRESH ---------------- */
function setConnStatus(msg){
  const el = document.getElementById('connStatus');
  if(el) el.textContent = msg;
}
document.getElementById('refreshBtn').addEventListener('click', ()=>{
  manualRefresh();
  setConnStatus('Refreshing…');
});

/* ---------------- AUTO-PLAY TOGGLE ---------------- */
function toggleAutoPlay(){
  if(!ROOM || MY_SEAT==null) return;
  const seats = ROOM.seats.slice();
  seats[MY_SEAT].autoPlay = !seats[MY_SEAT].autoPlay;
  db.collection(ROOMS).doc(ROOM_CODE).update({ seats }).then(()=>{
    updateAutoPlayButton();
  }).catch(e=>{
    console.error('autoPlay update failed', e);
    alert('Could not update auto-play: '+e.message);
  });
}
function updateAutoPlayButton(){
  const btn = document.getElementById('autoPlayBtn');
  if(!btn) return;
  if(!ROOM || MY_SEAT==null){
    btn.style.display = 'none';
    return;
  }
  btn.style.display = 'inline-block';
  const on = ROOM.seats[MY_SEAT]?.autoPlay;
  btn.textContent = on ? 'Auto: On' : 'Auto: Off';
  btn.classList.toggle('active', !!on);
}
document.getElementById('autoPlayBtn').addEventListener('click', toggleAutoPlay);

/* ---------------- COPY LOG / HISTORY ---------------- */
function copyToClipboard(text, successMsg){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>{
      alert(successMsg || 'Copied!');
    }).catch(()=>{
      prompt('Copy this text:', text);
    });
  } else {
    prompt('Copy this text:', text);
  }
}
document.getElementById('logCopy').addEventListener('click', ()=>{
  if(!G || !G.round || !G.round.log) return;
  copyToClipboard(G.round.log.join('\n'), 'Log copied to clipboard!');
});
document.getElementById('historyCopy').addEventListener('click', ()=>{
  if(!G || !G.roundHistory) return;
  let text = '';
  for(const r of G.roundHistory.slice().reverse()){
    const bidTeamNames = r.bidTeam==='A' ? (seatLabel(0)+' & '+seatLabel(2)) : (seatLabel(1)+' & '+seatLabel(3));
    const multTxt = r.mult===4 ? ' (×4 redoubled)' : r.mult===2 ? ' (×2 doubled)' : '';
    let scoreTxt;
    if(G.boardMode==='single'){
      const diff = r.scoreA - r.scoreB;
      scoreTxt = diff===0 ? '0' : diff>0 ? `${seatLabel(0)} & ${seatLabel(2)} ❤️ ${diff}` : `${seatLabel(1)} & ${seatLabel(3)} ❤️ ${-diff}`;
    } else {
      scoreTxt = `A: ${r.scoreA} — B: ${r.scoreB}`;
    }
    text += `Round ${r.n}: ${r.bidder} (${bidTeamNames}) bid ${r.bid}, took ${r.took}${multTxt} — ${r.madeIt?'made':'failed'}\n`;
    if(r.singlesPlayer) text += `Singles: ${r.singlesPlayer}\n`;
    if(r.sweepTeam) text += `Sweep by ${r.sweepTeam==='A'?seatLabel(0)+' & '+seatLabel(2):seatLabel(1)+' & '+seatLabel(3)}\n`;
    text += `Score after: ${scoreTxt}\n\n`;
  }
  copyToClipboard(text, 'History copied to clipboard!');
});

/* ---------------- OTHER UI ---------------- */
document.getElementById('newGameBtn').addEventListener('click', ()=>{
  if(!G || !G.round) return;
  const rd = G.round;
  rd.cancelVotes = rd.cancelVotes || [];
  if(rd.cancelVotes.includes(MY_SEAT)){ alert('You already voted to cancel — waiting on the others.'); return; }
  if(!confirm('Ask everyone to cancel this round and re-deal?')) return;
  rd.cancelVotes.push(MY_SEAT);
  logMsg(`${pname(MY_SEAT)} asked to cancel the round.`);
  announce(`${pname(MY_SEAT)} wants to cancel the round (${rd.cancelVotes.length}/${humanSeatsList().length})`);
  pushState();
  checkCancelVotes();
});
function checkCancelVotes(){
  if(!G || !G.round) return;
  const rd = G.round;
  if(IS_HOST && humanSeatsList().every(s=>(rd.cancelVotes||[]).includes(s))){
    cancelRound();
  }
}
let cancelPromptHandledFor = 0;
function checkCancelRoundPrompt(){
  if(!G || !G.round || MY_SEAT==null) return;
  const rd = G.round;
  const votes = rd.cancelVotes || [];
  if(votes.length===0){ cancelPromptHandledFor = 0; return; }
  if(votes.includes(MY_SEAT)) return;
  if(cancelPromptHandledFor===votes.length) return;
  cancelPromptHandledFor = votes.length;
  const requesterNames = votes.map(s=>pname(s)).join(', ');
  showOverlay('Cancel Round?', `${requesterNames} want${votes.length===1?'s':''} to cancel this round and re-deal. Do you agree?`, [
    {label:'Agree', cls:'primary', fn:()=>{
      hideOverlay();
      rd.cancelVotes = rd.cancelVotes || [];
      rd.cancelVotes.push(MY_SEAT);
      logMsg(`${pname(MY_SEAT)} agreed to cancel the round.`);
      pushState();
      checkCancelVotes();
    }},
    {label:'Decline', cls:'ghost', fn:()=>{
      hideOverlay();
      logMsg(`${pname(MY_SEAT)} declined — cancel request withdrawn.`);
      announce(`${pname(MY_SEAT)} declined the cancel request.`);
      rd.cancelVotes = [];
      pushState();
    }}
  ]);
}
document.getElementById('logToggle').addEventListener('click', ()=>{
  document.getElementById('logBox').classList.toggle('show');
});
document.getElementById('logClose').addEventListener('click', ()=>{
  document.getElementById('logBox').classList.remove('show');
});
document.getElementById('historyToggle').addEventListener('click', ()=>{
  document.getElementById('historyBox').classList.toggle('show');
});
document.getElementById('historyClose').addEventListener('click', ()=>{
  document.getElementById('historyBox').classList.remove('show');
});

/* ---------------- BOOT ---------------- */
function setVH(){ document.documentElement.style.setProperty('--vh', (window.innerHeight*0.01)+'px'); }
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', ()=>setTimeout(setVH,150));

auth.onAuthStateChanged(user=>{
  if(!user){ auth.signInAnonymously().catch(e=>console.error(e)); return; }
  myUid = user.uid;
  const urlCode = new URLSearchParams(location.search).get('room');
  if(urlCode){
    pendingJoinCode = urlCode.toUpperCase();
    nameFlowMode = 'join';
    document.getElementById('nameScreenTitle').textContent = 'Join Room '+pendingJoinCode;
    showScreen('screenName');
  } else {
    showScreen('screenHome');
  }
});
</script>
